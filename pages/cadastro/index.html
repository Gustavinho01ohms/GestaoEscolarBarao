<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Gestão PEI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cadastro-container">
        <div class="cadastro-box">
            <img src="/src/logo.png" alt="logo Escola Barão de Jundiaí" id="logo">
            
            <h2>Solicitar Acesso</h2>
            <p>Preencha seus dados. O acesso será liberado após validação da gestão.</p>
            
            <div id="mensagem" class="mensagem oculta"></div>

            <form id="formCadastro">
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Ex: Maria Souza">
                </div>
                
                <div class="input-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" required placeholder="000.000.000-00" maxlength="14">
                </div>
                
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>
                
                <div class="input-group">
                    <label for="senha">Crie uma Senha</label>
                    <input type="password" id="senha" required placeholder="Mínimo 6 caracteres" minlength="6">
                </div>

                <div class="input-group">
                    <label for="confirmaSenha">Confirme a Senha</label>
                    <input type="password" id="confirmaSenha" required placeholder="Repita a senha">
                </div>
                
                <button type="submit" id="btnCadastrar">Enviar Solicitação</button>
            </form>

            <div class="links-uteis">
                <a href="../../login.html">Já tem uma conta? Voltar ao Login</a>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE ENVIO REAL PARA O POSTGRESQL -->
    <script>
        // Máscara de CPF
        document.getElementById('cpf').addEventListener('input', function (e) {
            let valor = e.target.value.replace(/\D/g, "");
            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            e.target.value = valor;
        });

        // Envio do Formulário
        document.getElementById('formCadastro').addEventListener('submit', async function(event) {
            event.preventDefault();

            const senha = document.getElementById('senha').value;
            const confirmaSenha = document.getElementById('confirmaSenha').value;
            const divMensagem = document.getElementById('mensagem');
            const btnCadastrar = document.getElementById('btnCadastrar');

            // 1. Validação básica
            if (senha !== confirmaSenha) {
                divMensagem.className = 'mensagem erro';
                divMensagem.innerText = 'As senhas não coincidem!';
                return;
            }

            btnCadastrar.disabled = true;
            btnCadastrar.innerText = 'Enviando...';

            // 2. Monta o pacote de dados
            const dadosCadastro = {
                nome: document.getElementById('nome').value,
                cpf: document.getElementById('cpf').value,
                email: document.getElementById('email').value,
                senha: senha,
                perfil_id: 2 // Por padrão, quem se cadastra aqui é PROFESSOR
            };

            // 3. Comunicação com a API (Node.js)
            try {
                const resposta = await fetch('http://localhost:3000/api/cadastro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosCadastro)
                });

                const dados = await resposta.json();

                // 4. Trata a resposta do servidor
                if (resposta.ok) {
                    divMensagem.className = 'mensagem sucesso';
                    divMensagem.innerText = 'Solicitação enviada! Aguarde a liberação da gestão.';
                    document.getElementById('formCadastro').reset();
                } else {
                    divMensagem.className = 'mensagem erro';
                    divMensagem.innerText = dados.erro || 'Erro ao realizar cadastro.';
                }

            } catch (erro) {
                divMensagem.className = 'mensagem erro';
                divMensagem.innerText = 'Erro de conexão com o servidor.';
                console.error(erro);
            } finally {
                btnCadastrar.disabled = false;
                btnCadastrar.innerText = 'Enviar Solicitação';
            }
        });
    </script>
</body>
</html>
